name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [Defaults, MixedPremium, KeywordFilters, HubMenu, CollapseMode, Pagination]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Tests/${{ matrix.suite }}/${{ matrix.suite }}.csproj -c Release

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 Tools/check_docs.py
      - run: python3 -m unittest discover -s Tests/Release -v
      - run: python3 -m unittest discover -s Tests/Installer -v

  bepinex-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download the pinned official BepInEx core
        shell: bash
        run: |
          curl -fsSL https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.6/BepInEx_win_x64_5.4.23.6.zip -o "$RUNNER_TEMP/bepinex.zip"
          echo "6c57a714a892efb4e9e1fef63d608a3391f30ec984031c465404e4ee381a0755  $RUNNER_TEMP/bepinex.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/bepinex.zip" 'BepInEx/core/*' -d "$RUNNER_TEMP/bepinex"
      - name: Check CFG persistence and Firestone metadata
        run: dotnet run --project Tests/BepInEx/BepInEx.csproj -c Release -p:BepInExCoreDir="$RUNNER_TEMP/bepinex/BepInEx/core" -- --config-only
